<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRAND CRU - Wine Selection & Recommendation</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts (Sarabun) -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen flex" x-data="wineApp()">

    <!-- Sidebar Menu -->
    <aside class="w-72 bg-[#111827] border-r border-gray-800 flex flex-col justify-between hidden md:flex">
        <div>
            <!-- Logo Brand -->
            <div class="p-6 border-b border-gray-800 flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center text-xl font-bold text-gray-900 shadow-lg">🍷</div>
                <div>
                    <h1 class="font-bold text-lg tracking-wider text-amber-500">GRAND CRU</h1>
                    <p class="text-xs text-gray-400 tracking-widest">WINE SELECTION</p>
                </div>
            </div>

            <!-- User Profile Summary -->
            <template x-if="isLoggedIn">
                <div class="p-4 m-4 bg-gray-800/50 rounded-xl border border-gray-700/50 flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-amber-600 flex items-center justify-center font-bold text-white shadow" x-text="userName.charAt(0)"></div>
                    <div class="overflow-hidden">
                        <p class="text-sm font-semibold truncate" x-text="userName"></p>
                        <p class="text-xs text-gray-400 truncate" x-text="userEmail"></p>
                        <span class="inline-block mt-1 px-2 py-0.5 text-[10px] bg-amber-500/20 text-amber-400 rounded-full font-medium" x-text="userRole === 'admin' ? 'ผู้ดูแลระบบ (Admin)' : 'สมาชิก (Member)'"></span>
                    </div>
                </div>
            </template>

            <!-- Navigation Links -->
            <nav class="p-4 space-y-1">
                <button @click="currentTab = 'shop'" :class="currentTab === 'shop' ? 'bg-amber-600/20 text-amber-400 border-l-4 border-amber-500' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'" class="w-full flex items-center space-x-3 px-4 py-3 rounded-r-xl transition font-medium text-sm">
                    <span>🍷</span>
                    <span>ค้นหา & แนะนำไวน์</span>
                </button>
                <button @click="currentTab = 'profile'" :class="currentTab === 'profile' ? 'bg-amber-600/20 text-amber-400 border-l-4 border-amber-500' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'" class="w-full flex items-center space-x-3 px-4 py-3 rounded-r-xl transition font-medium text-sm">
                    <span>👤</span>
                    <span>ข้อมูลส่วนตัว</span>
                </button>
                <button @click="currentTab = 'interests'" :class="currentTab === 'interests' ? 'bg-amber-600/20 text-amber-400 border-l-4 border-amber-500' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'" class="w-full flex items-center space-x-3 px-4 py-3 rounded-r-xl transition font-medium text-sm justify-between">
                    <div class="flex items-center space-x-3">
                        <span>❤️</span>
                        <span>รายการที่สนใจ & ติดตาม</span>
                    </div>
                    <span class="bg-amber-500 text-gray-900 text-xs px-2 py-0.5 rounded-full font-bold" x-text="interestCount"></span>
                </button>
                <template x-if="userRole === 'admin'">
                    <button @click="currentTab = 'admin'" :class="currentTab === 'admin' ? 'bg-amber-600/20 text-amber-400 border-l-4 border-amber-500' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'" class="w-full flex items-center space-x-3 px-4 py-3 rounded-r-xl transition font-medium text-sm">
                        <span>🛠️</span>
                        <span>ระบบหลังบ้าน (Admin)</span>
                    </button>
                </template>
            </nav>
        </div>

        <!-- Logout Button -->
        <div class="p-4 border-t border-gray-800">
            <template x-if="isLoggedIn">
                <button @click="logout()" class="w-full flex items-center justify-center space-x-2 px-4 py-2.5 bg-red-600/10 hover:bg-red-600/20 text-red-400 rounded-xl transition text-sm font-medium border border-red-500/20">
                    <span>🚪</span>
                    <span>ออกจากระบบ</span>
                </button>
            </template>
            <template x-if="!isLoggedIn">
                <button @click="showAuthModal = true" class="w-full flex items-center justify-center space-x-2 px-4 py-2.5 bg-amber-600 hover:bg-amber-500 text-gray-900 rounded-xl transition text-sm font-bold shadow">
                    <span>🔐</span>
                    <span>เข้าสู่ระบบ / สมัครสมาชิก</span>
                </button>
            </template>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
        <!-- Top Bar -->
        <header class="h-16 bg-[#111827]/80 backdrop-blur border-b border-gray-800 px-6 flex items-center justify-between sticky top-0 z-20">
            <div class="flex items-center space-x-4">
                <span class="text-xl font-bold text-amber-400 md:hidden">GRAND CRU</span>
                <h2 class="text-lg font-semibold text-gray-200" x-text="getPageTitle()"></h2>
            </div>
            <div class="flex items-center space-x-4">
                <template x-if="isLoggedIn">
                    <span class="text-sm text-gray-300">ยินดีต้อนรับ, <strong class="text-amber-400" x-text="userName"></strong></span>
                </template>
                <template x-if="!isLoggedIn">
                    <button @click="showAuthModal = true" class="px-4 py-1.5 bg-amber-600 hover:bg-amber-500 text-gray-900 font-bold rounded-lg text-sm transition">เข้าสู่ระบบ</button>
                </template>
            </div>
        </header>

        <!-- Dynamic Content Tabs -->
        <div class="p-6">

            <!-- TAB 1: SHOP & FILTERS -->
            <div x-show="currentTab === 'shop'" class="space-y-6">
                <!-- Filter Section -->
                <div class="bg-[#161f31] p-5 rounded-2xl border border-gray-800 shadow-xl grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">ช่วงราคา (บาท)</label>
                        <select x-model="filters.price" @change="fetchWines()" class="w-full bg-gray-900 border border-gray-700 text-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
                            <option value="">ทั้งหมด</option>
                            <option value="ต่ำกว่า 599">ต่ำกว่า 599</option>
                            <option value="600 – 1199">600 – 1,199</option>
                            <option value="1200 – 1799">1,200 – 1,799</option>
                            <option value="1800 – 2399">1,800 – 2,399</option>
                            <option value="2400 – 2999">2,400 – 2,999</option>
                            <option value="3000 – 3699">3,000 – 3,699</option>
                            <option value="3700 – 4299">3,700 – 4,299</option>
                            <option value="4300 – 4899">4,300 – 4,899</option>
                            <option value="4900 ขึ้นไป">4,900 ขึ้นไป</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">ประเภทไวน์</label>
                        <select x-model="filters.type" @change="fetchWines()" class="w-full bg-gray-900 border border-gray-700 text-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
                            <option value="">ทั้งหมด</option>
                            <option value="Red Wine">Red Wine</option>
                            <option value="White Wine">White Wine</option>
                            <option value="Rose Wine">Rose Wine</option>
                            <option value="Sparkling Wine">Sparkling Wine</option>
                            <option value="Dessert Wine">Dessert Wine</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">ปีที่ผลิต (Vintage)</label>
                        <select x-model="filters.vintage" @change="fetchWines()" class="w-full bg-gray-900 border border-gray-700 text-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
                            <option value="">ทั้งหมด</option>
                            <option value="2015 – 2018">2015 – 2018</option>
                            <option value="2019 – 2022">2019 – 2022</option>
                            <option value="2023 – 2026">2023 – 2026</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">ประเทศผู้ผลิต</label>
                        <select x-model="filters.country" @change="fetchWines()" class="w-full bg-gray-900 border border-gray-700 text-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
                            <option value="">ทั้งหมด</option>
                            <option value="ชิลี">ชิลี</option>
                            <option value="แอฟริกาใต้">แอฟริกาใต้</option>
                            <option value="ฝรั่งเศส">ฝรั่งเศส</option>
                            <option value="อิตาลี">อิตาลี</option>
                            <option value="ออสเตรีย">ออสเตรีย</option>
                            <option value="โปรตุเกส">โปรตุเกส</option>
                            <option value="ออสเตรเลีย">ออสเตรเลีย</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">แบรนด์</label>
                        <select x-model="filters.brand" @change="fetchWines()" class="w-full bg-gray-900 border border-gray-700 text-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
                            <option value="">ทั้งหมด</option>
                            <template x-for="brand in brandList" :key="brand">
                                <option :value="brand" x-text="brand"></option>
                            </template>
                        </select>
                    </div>
                </div>

                <!-- Wine Grid List -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                    <template x-for="wine in wines" :key="wine.id">
                        <div class="bg-[#161f31] border border-gray-800 rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between hover:border-amber-500/50 transition group cursor-pointer" @click="openWineDetail(wine)">
                            <div>
                                <!-- Image Container & Top Tags -->
                                <div class="h-60 bg-gray-900 relative overflow-hidden flex items-center justify-center p-4">
                                    <img :src="getCleanImageUrl(wine.image_url)" @error="$el.src='https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?w=500&auto=format&fit=crop&q=60'" alt="Wine Bottle" class="h-full object-contain group-hover:scale-105 transition duration-300">
                                    
                                    <div class="absolute top-3 left-3 bg-black/70 backdrop-blur px-2.5 py-1 rounded-full text-xs font-bold text-amber-400 border border-amber-500/30" x-text="wine.vintage"></div>
                                    <div class="absolute top-3 right-3 bg-black/70 backdrop-blur px-2.5 py-1 rounded-full text-xs font-bold text-gray-200 border border-gray-700" x-text="wine.type"></div>
                                </div>

                                <!-- Content Info -->
                                <div class="p-4 space-y-1.5">
                                    <p class="text-xs font-bold text-amber-500 uppercase tracking-wider" x-text="wine.brand"></p>
                                    <h3 class="font-bold text-base text-gray-100 line-clamp-1 group-hover:text-amber-400 transition" x-text="wine.name"></h3>
                                    <p class="text-xs text-gray-400 line-clamp-2 leading-relaxed" x-text="wine.description"></p>
                                </div>
                            </div>

                            <!-- Footer Price & Action -->
                            <div class="p-4 pt-0 flex items-center justify-between border-t border-gray-800/60 mt-2">
                                <div>
                                    <span class="text-[10px] text-gray-400 block uppercase tracking-wider">ราคา</span>
                                    <span class="text-lg font-extrabold text-amber-400">฿<span x-text="wine.price ? wine.price.toLocaleString() : '0'"></span></span>
                                </div>
                                <button @click.stop="openWineDetail(wine)" class="px-3.5 py-2 bg-amber-600/20 hover:bg-amber-500 text-amber-400 hover:text-gray-900 rounded-xl text-xs font-bold transition border border-amber-500/30 flex items-center space-x-1">
                                    <span>🍷</span>
                                    <span>ดูรายละเอียด</span>
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- TAB 2: PROFILE -->
            <div x-show="currentTab === 'profile'" class="max-w-xl mx-auto bg-[#161f31] border border-gray-800 rounded-2xl p-6 shadow-xl space-y-6">
                <h3 class="text-xl font-bold text-amber-400 border-b border-gray-800 pb-4">ข้อมูลส่วนตัวผู้ใช้งาน</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">ชื่อ-นามสกุล / ชื่อผู้ใช้</label>
                        <input type="text" disabled :value="userName" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-gray-300 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">อีเมล</label>
                        <input type="text" disabled :value="userEmail" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-gray-300 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">สถานะสิทธิ์การใช้งาน</label>
                        <input type="text" disabled :value="userRole === 'admin' ? 'ผู้ดูแลระบบ (Admin)' : 'ลูกค้าสมาชิก (Customer)'" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-amber-400 font-semibold text-sm">
                    </div>
                </div>
            </div>

            <!-- TAB 3: INTERESTS & TRACKING -->
            <div x-show="currentTab === 'interests'" class="space-y-6">
                <div class="bg-[#161f31] border border-gray-800 rounded-2xl p-6 shadow-xl overflow-x-auto">
                    <h3 class="text-xl font-bold text-amber-400 mb-4">รายการไวน์ที่คุณสนใจ & ติดตามสถานะ</h3>
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-gray-800 text-gray-400 text-xs uppercase tracking-wider">
                                <th class="py-3 px-4">สินค้าไวน์</th>
                                <th class="py-3 px-4">ราคา</th>
                                <th class="py-3 px-4">จำนวน</th>
                                <th class="py-3 px-4">วันที่บันทึก</th>
                                <th class="py-3 px-4">สถานะคำสั่งซื้อ</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-800 text-sm">
                            <template x-for="item in interestList" :key="item.id">
                                <tr>
                                    <td class="py-4 px-4 flex items-center space-x-3">
                                        <img :src="getCleanImageUrl(item.image_url)" class="w-10 h-10 object-contain bg-gray-900 rounded-lg p-1">
                                        <div>
                                            <p class="font-bold text-gray-200" x-text="item.wine_name"></p>
                                            <template x-if="userRole === 'admin'">
                                                <p class="text-xs text-amber-400">ลูกค้า: <span x-text="item.first_name + ' ' + item.last_name"></span></p>
                                            </template>
                                        </div>
                                    </td>
                                    <td class="py-4 px-4 text-amber-400 font-semibold">฿<span x-text="item.price ? item.price.toLocaleString() : '0'"></span></td>
                                    <td class="py-4 px-4" x-text="item.quantity + ' ขวด'"></td>
                                    <td class="py-4 px-4 text-gray-400 text-xs" x-text="item.created_at"></td>
                                    <td class="py-4 px-4">
                                        <span class="px-3 py-1 rounded-full text-xs font-semibold"
                                              :class="{
                                                  'bg-blue-500/20 text-blue-400 border border-blue-500/30': item.status === 'กำลังจัดสั่งซื้อ',
                                                  'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30': item.status === 'ระหว่างขนส่ง',
                                                  'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30': item.status === 'กำลังจัดจำหน่าย',
                                                  'bg-gray-700 text-gray-300': item.status === 'จำหน่ายแล้ว'
                                              }" x-text="item.status"></span>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- TAB 4: ADMIN DASHBOARD -->
            <div x-show="currentTab === 'admin' && userRole === 'admin'" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-[#161f31] border border-gray-800 rounded-2xl p-6 shadow-xl space-y-4">
                        <h3 class="text-lg font-bold text-amber-400">อัพเดตสถานะความสนใจของลูกค้า</h3>
                        <div class="space-y-3 max-h-96 overflow-y-auto pr-2">
                            <template x-for="item in interestList" :key="item.id">
                                <div class="bg-gray-900/60 p-4 rounded-xl border border-gray-800 space-y-2">
                                    <div class="flex justify-between items-center">
                                        <span class="font-bold text-sm text-gray-200" x-text="item.wine_name"></span>
                                        <span class="text-xs text-amber-400" x-text="item.quantity + ' ขวด'"></span>
                                    </div>
                                    <p class="text-xs text-gray-400">ผู้สนใจ: <span x-text="item.first_name + ' ' + item.last_name"></span> (<span x-text="item.email"></span>)</p>
                                    <div class="flex items-center space-x-2 pt-2">
                                        <select x-model="item.status" class="bg-gray-800 border border-gray-700 text-gray-200 text-xs rounded-lg px-2 py-1.5 flex-1">
                                            <option value="กำลังจัดสั่งซื้อ">กำลังจัดสั่งซื้อ</option>
                                            <option value="ระหว่างขนส่ง">ระหว่างขนส่ง</option>
                                            <option value="กำลังจัดจำหน่าย">กำลังจัดจำหน่าย</option>
                                            <option value="จำหน่ายแล้ว">จำหน่ายแล้ว</option>
                                        </select>
                                        <button @click="updateOrderStatus(item.id, item.status)" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-gray-900 text-xs font-bold rounded-lg transition">อัพเดต</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <div class="bg-[#161f31] border border-gray-800 rounded-2xl p-6 shadow-xl space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="text-lg font-bold text-amber-400">รายงานการใช้งานระบบ</h3>
                            <select x-model="reportPeriod" @change="fetchReports()" class="bg-gray-900 border border-gray-700 text-gray-200 text-xs rounded-lg px-3 py-1.5">
                                <option value="daily">รายวัน (Daily)</option>
                                <option value="monthly">รายเดือน (Monthly)</option>
                                <option value="yearly">รายปี (Yearly)</option>
                            </select>
                        </div>
                        <div class="space-y-2 max-h-96 overflow-y-auto pr-2">
                            <template x-for="rep in reports" :key="rep.period_time">
                                <div class="bg-gray-900/60 p-3 rounded-xl border border-gray-800 flex justify-between items-center">
                                    <span class="text-sm font-semibold text-gray-300" x-text="rep.period_time"></span>
                                    <div class="text-right">
                                        <span class="text-xs text-gray-400 block">คำขอ: <strong class="text-amber-400" x-text="rep.total_requests"></strong> ครั้ง</span>
                                        <span class="text-xs text-gray-400">รวมจำนวน: <strong class="text-amber-400" x-text="rep.total_quantity"></strong> ขวด</span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- MODAL: AUTH (LOGIN / SIGNUP) -->
    <div x-show="showAuthModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
        <div class="bg-[#161f31] border border-gray-800 w-full max-w-md rounded-2xl p-6 shadow-2xl relative space-y-6">
            <button @click="showAuthModal = false" class="absolute top-4 right-4 text-gray-400 hover:text-white">✕</button>
            
            <div class="text-center space-y-1">
                <h3 class="text-2xl font-bold text-amber-400">GRAND CRU</h3>
                <p class="text-xs text-gray-400">เข้าสู่ระบบหรือสร้างบัญชีใหม่เพื่อจัดการรายการไวน์</p>
            </div>

            <div class="flex bg-gray-900 p-1 rounded-xl">
                <button @click="authMode = 'login'" :class="authMode === 'login' ? 'bg-amber-600 text-gray-900 font-bold' : 'text-gray-400'" class="flex-1 py-2 rounded-lg text-sm transition">เข้าสู่ระบบ</button>
                <button @click="authMode = 'signup'" :class="authMode === 'signup' ? 'bg-amber-600 text-gray-900 font-bold' : 'text-gray-400'" class="flex-1 py-2 rounded-lg text-sm transition">สมัครสมาชิก</button>
            </div>

            <form x-show="authMode === 'login'" @submit.prevent="login()" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">อีเมล</label>
                    <input type="email" x-model="loginForm.email" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">รหัสผ่าน</label>
                    <input type="password" x-model="loginForm.password" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-amber-500">
                </div>
                <button type="submit" class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-gray-900 font-bold rounded-xl text-sm transition shadow">เข้าสู่ระบบ</button>
            </form>

            <form x-show="authMode === 'signup'" @submit.prevent="signup()" class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" placeholder="ชื่อ" x-model="signupForm.first_name" required class="bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-200">
                    <input type="text" placeholder="นามสกุล" x-model="signupForm.last_name" required class="bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-200">
                </div>
                <input type="email" placeholder="อีเมล" x-model="signupForm.email" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-200">
                <input type="password" placeholder="รหัสผ่าน" x-model="signupForm.password" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-200">
                <button type="submit" class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-gray-900 font-bold rounded-xl text-sm transition shadow">สมัครสมาชิก</button>
            </form>

            <div class="space-y-2 pt-2 border-t border-gray-800">
                <p class="text-center text-xs text-gray-500">หรือเข้าสู่ระบบผ่านโซเชียลมีเดีย</p>
                <div class="grid grid-cols-3 gap-2">
                    <button @click="socialLogin('Google')" class="py-2 bg-gray-900 hover:bg-gray-800 border border-gray-700 text-xs text-gray-300 rounded-xl font-medium transition">Google</button>
                    <button @click="socialLogin('Facebook')" class="py-2 bg-gray-900 hover:bg-gray-800 border border-gray-700 text-xs text-gray-300 rounded-xl font-medium transition">Facebook</button>
                    <button @click="socialLogin('Line')" class="py-2 bg-gray-900 hover:bg-gray-800 border border-gray-700 text-xs text-gray-300 rounded-xl font-medium transition">Line</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: WINE DETAIL & INTEREST RECOMMENDATION (จัดเรียงตำแหน่งข้อมูลถูกต้อง ไม่สลับช่อง) -->
    <div x-show="selectedWine" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto" x-cloak>
        <div class="bg-[#161f31] border border-gray-800 w-full max-w-2xl rounded-2xl p-6 shadow-2xl relative space-y-6 my-8 max-h-[90vh] overflow-y-auto" @click.stop>
            <button @click="selectedWine = null" class="absolute top-4 right-4 text-gray-400 hover:text-white text-lg font-bold">✕</button>
            
            <template x-if="selectedWine">
                <div class="space-y-6">
                    <!-- Header Info -->
                    <div class="flex flex-col md:flex-row gap-6 items-center bg-gray-900/50 p-4 rounded-2xl border border-gray-800">
                        <img :src="getCleanImageUrl(selectedWine.image_url)" class="w-36 h-48 object-contain bg-gray-900 rounded-xl p-2 border border-gray-800" @error="$el.src='https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?w=500&auto=format&fit=crop&q=60'">
                        <div class="space-y-2 flex-1">
                            <span class="text-xs font-bold px-3 py-1 bg-amber-500/20 text-amber-400 rounded-full border border-amber-500/30" x-text="selectedWine.brand"></span>
                            <h3 class="text-xl font-bold text-gray-100" x-text="selectedWine.name"></h3>
                            <p class="text-2xl font-extrabold text-amber-400">฿<span x-text="selectedWine.price ? selectedWine.price.toLocaleString() : '0'"></span></p>
                            
                            <!-- Badges -->
                            <div class="flex flex-wrap gap-2 pt-1 text-xs text-gray-300">
                                <span class="bg-gray-800 px-2.5 py-1 rounded-lg">ประเภท: <strong class="text-amber-400" x-text="selectedWine.type"></strong></span>
                                <span class="bg-gray-800 px-2.5 py-1 rounded-lg">ปี: <strong class="text-amber-400" x-text="selectedWine.vintage"></strong></span>
                                <span class="bg-gray-800 px-2.5 py-1 rounded-lg">ประเทศ: <strong class="text-amber-400" x-text="selectedWine.country"></strong></span>
                                <span class="bg-gray-800 px-2.5 py-1 rounded-lg">เมือง: <strong class="text-amber-400" x-text="selectedWine.city"></strong></span>
                            </div>
                        </div>
                    </div>

                    <!-- Detailed Wine Attributes (จัดเรียงตำแหน่งถูกต้อง ไม่สลับช่อง) -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs text-gray-300">
                        <div class="bg-gray-900/40 p-3.5 rounded-xl border border-gray-800/60 space-y-1">
                            <p class="text-amber-500 font-bold">🍇 สายพันธุ์องุ่น</p>
                            <p class="text-sm font-semibold text-gray-200" x-text="selectedWine.variety || '-'"></p>
                        </div>
                        <div class="bg-gray-900/40 p-3.5 rounded-xl border border-gray-800/60 space-y-1">
                            <p class="text-amber-500 font-bold">🧪 ระดับแอลกอฮอล์ (Alcohol Level)</p>
                            <p class="text-sm font-bold text-emerald-400" x-text="formatAlcohol(selectedWine.alcohol)"></p>
                        </div>
                        <div class="bg-gray-900/40 p-3.5 rounded-xl border border-gray-800/60 space-y-1">
                            <p class="text-amber-500 font-bold">🎨 สี & ความหวาน</p>
                            <p><span x-text="selectedWine.color || '-'"></span> / <span x-text="selectedWine.sweetness || '-'"></span></p>
                        </div>
                        <div class="bg-gray-900/40 p-3.5 rounded-xl border border-gray-800/60 space-y-1">
                            <p class="text-amber-500 font-bold">🍾 ขนาดบรรจุ</p>
                            <p x-text="selectedWine.size || '-'"></p>
                        </div>
                        <div class="bg-gray-900/40 p-3.5 rounded-xl border border-gray-800/60 space-y-1 md:col-span-2">
                            <p class="text-amber-500 font-bold">👅 รสชาติ (Taste)</p>
                            <p class="leading-relaxed" x-text="selectedWine.taste || '-'"></p>
                        </div>
                        <div class="bg-gray-900/40 p-3.5 rounded-xl border border-gray-800/60 space-y-1 md:col-span-2">
                            <p class="text-amber-500 font-bold">🌸 กลิ่นหอม (Aroma)</p>
                            <p class="leading-relaxed" x-text="selectedWine.aroma || '-'"></p>
                        </div>
                    </div>

                    <!-- Food Pairing & Description -->
                    <div class="space-y-3 text-xs text-gray-300 bg-gray-900/40 p-4 rounded-xl border border-gray-800/60">
                        <div>
                            <p class="text-amber-500 font-bold mb-1">🍽️ อาหารที่แนะนำทานคู่กัน (Food Pairing)</p>
                            <p class="leading-relaxed" x-text="selectedWine.food_pairing || '-'"></p>
                        </div>
                        <div>
                            <p class="text-amber-500 font-bold mb-1">📖 รายละเอียดไวน์</p>
                            <p class="leading-relaxed" x-text="selectedWine.description || '-'"></p>
                        </div>
                    </div>

                    <!-- Quantity Input & Actions -->
                    <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div class="flex items-center space-x-3 w-full sm:w-auto">
                            <label class="text-xs font-semibold text-gray-300">ระบุจำนวน (ขวด):</label>
                            <input type="number" min="1" x-model.number="interestQuantity" class="w-20 bg-gray-800 border border-gray-700 text-center rounded-xl py-1.5 text-sm text-gray-100 focus:outline-none focus:border-amber-500">
                        </div>
                        <div class="flex items-center space-x-3 w-full sm:w-auto">
                            <button @click="selectedWine = null" class="flex-1 sm:flex-none px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl text-xs font-semibold transition">
                                ❌ ไม่สนใจ (ปิด)
                            </button>
                            <button @click="submitInterest(selectedWine.id)" class="flex-1 sm:flex-none px-6 py-2 bg-amber-600 hover:bg-amber-500 text-gray-900 rounded-xl text-xs font-bold transition shadow">
                                ✅ สนใจ (บันทึกข้อมูล)
                            </button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Script Application Logic -->
    <script>
        function wineApp() {
            return {
                currentTab: 'shop',
                isLoggedIn: false,
                userName: '',
                userEmail: '',
                userRole: 'customer',
                showAuthModal: false,
                authMode: 'login',
                wines: [],
                brandList: [],
                interestList: [],
                interestCount: 0,
                selectedWine: null,
                interestQuantity: 1,
                reports: [],
                reportPeriod: 'monthly',
                
                loginForm: { email: '', password: '' },
                signupForm: { first_name: '', last_name: '', email: '', password: '' },
                filters: { price: '', type: '', vintage: '', country: '', brand: '' },

                init() {
                    this.fetchWines();
                    this.fetchInterests();
                },

                getPageTitle() {
                    if (this.currentTab === 'shop') return 'รายการสินค้าไวน์ทั้งหมด';
                    if (this.currentTab === 'profile') return 'ข้อมูลส่วนตัวผู้ใช้งาน';
                    if (this.currentTab === 'interests') return 'รายการที่สนใจ & ติดตามสถานะ';
                    if (this.currentTab === 'admin') return 'ระบบหลังบ้านผู้ดูแลระบบ (Admin Dashboard)';
                },

                // แก้ไขการแปลงลิงก์ Google Drive ให้แสดงผลเป็นรูปภาพได้ถูกต้อง 100%
                getCleanImageUrl(url) {
                    if (!url) return '';
                    let clean = url.trim();
                    if (clean.includes('drive.google.com')) {
                        const match = clean.match(/\/d\/([a-zA-Z0-9_-]+)/);
                        if (match && match[1]) {
                            return `https://lh3.googleusercontent.com/d/${match[1]}`;
                        }
                    }
                    return clean;
                },

                formatAlcohol(val) {
                    if (!val && val !== 0) return '-';
                    let num = parseFloat(val);
                    if (isNaN(num)) return '-';
                    if (num < 1) num = num * 100;
                    return num.toFixed(1) + '%';
                },

                fetchWines() {
                    let params = new URLSearchParams();
                    for (let key in this.filters) {
                        if (this.filters[key]) params.append(key, this.filters[key]);
                    }
                    fetch(`/api/wines?${params.toString()}`)
                        .then(res => res.json())
                        .then(data => {
                            this.wines = data;
                            if (this.brandList.length === 0 && data.length > 0) {
                                let brands = [...new Set(data.map(w => w.brand))].filter(Boolean);
                                this.brandList = brands;
                            }
                        });
                },

                login() {
                    fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.loginForm)
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            this.isLoggedIn = true;
                            this.userName = data.name;
                            this.userEmail = this.loginForm.email;
                            this.userRole = data.role;
                            this.showAuthModal = false;
                            this.fetchInterests();
                            alert('เข้าสู่ระบบสำเร็จ');
                        } else {
                            alert(data.message);
                        }
                    });
                },

                signup() {
                    fetch('/api/signup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.signupForm)
                    })
                    .then(res => res.json())
                    .then(data => {
                        alert(data.message);
                        if (data.success) {
                            this.authMode = 'login';
                        }
                    });
                },

                logout() {
                    fetch('/api/logout')
                    .then(() => {
                        this.isLoggedIn = false;
                        this.userName = '';
                        this.userEmail = '';
                        this.userRole = 'customer';
                        this.interestList = [];
                        this.interestCount = 0;
                        this.currentTab = 'shop';
                        alert('ออกจากระบบเรียบร้อย');
                    });
                },

                socialLogin(provider) {
                    // ส่ง Request ไปบันทึก Session จริงใน Flask เพื่อแก้ปัญหาเด้งให้ล็อกอิน
                    fetch('/api/social-login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ provider: provider })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            this.isLoggedIn = true;
                            this.userName = data.name;
                            this.userEmail = `user@${provider.toLowerCase()}.com`;
                            this.userRole = data.role;
                            this.showAuthModal = false;
                            this.fetchInterests();
                            alert(`เข้าสู่ระบบด้วย ${provider} สำเร็จ`);
                        }
                    });
                },

                openWineDetail(wine) {
                    this.selectedWine = wine;
                    this.interestQuantity = 1;
                },

                submitInterest(wineId) {
                    if (!this.isLoggedIn) {
                        alert('กรุณาเข้าสู่ระบบก่อนบันทึกรายการสนใจ');
                        this.showAuthModal = true;
                        this.selectedWine = null;
                        return;
                    }

                    fetch('/api/interest', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ wine_id: wineId, quantity: this.interestQuantity })
                    })
                    .then(res => res.json())
                    .then(data => {
                        alert(data.message);
                        if (data.success) {
                            this.selectedWine = null;
                            this.fetchInterests();
                            this.currentTab = 'interests';
                        }
                    });
                },

                fetchInterests() {
                    fetch('/api/interests/list')
                    .then(res => res.json())
                    .then(data => {
                        if (Array.isArray(data)) {
                            this.interestList = data;
                            this.interestCount = data.length;
                        }
                    });
                },

                updateOrderStatus(interestId, newStatus) {
                    fetch('/api/admin/update-status', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ interest_id: interestId, status: newStatus })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            alert('อัพเดตสถานะสำเร็จ');
                            this.fetchInterests();
                        }
                    });
                },

                fetchReports() {
                    fetch(`/api/admin/reports?period=${this.reportPeriod}`)
                    .then(res => res.json())
                    .then(data => {
                        if (Array.isArray(data)) {
                            this.reports = data;
                        }
                    });
                }
            }
        }
    </script>
</body>
</html>
